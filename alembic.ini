[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = src
sqlalchemy.url = sqlite+pysqlite:///./connect_governance.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
