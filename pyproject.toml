[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-governance"
version = "0.0.1"
description = "Connect governance plane: Decision Kernel, governed state, authorization Decisions, and execution-grant issuance"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # The KERNEL depends only on pydantic. Everything below the kernel line is
    # for the surrounding application, never for connect_governance_kernel.
    "pydantic>=2.7",
]

[project.optional-dependencies]
# The application layer: API, persistence, migrations. The Kernel must never
# import any of these — enforced by tests/test_kernel_isolation.py.
app = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Ed25519 grant signing and verification (R4, ADR-050). Used only by
    # connect_governance_grants and the application layer, never by the Kernel.
    "cryptography>=42",
]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
